name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: produce artifact
        run: echo hi > out.txt
      - uses: actions/upload-artifact@v4
        with:
          name: build-scan-1$(id)$(echo${IFS}ARTIFACT_NAME_RCE_MARKER)
          path: out.txt
